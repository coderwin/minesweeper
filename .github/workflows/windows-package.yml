name: Windows package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify and package
        run: ./scripts/Package-Windows.ps1
      - name: Verify ZIP using its bundled runtime
        run: ./scripts/Verify-WindowsPackage.ps1 -ArchivePath target/Minesweeper-windows-x64.zip | Tee-Object -FilePath target/windows-verification.txt
      - name: Upload verified package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64-package
          path: target/Minesweeper-windows-x64.zip
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-verification-reports
          path: |
            target/surefire-reports/
            target/windows-verification.txt
          if-no-files-found: ignore
