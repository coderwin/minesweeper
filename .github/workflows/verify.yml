name: Java 17 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test without a desktop
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Djava.awt.headless=true -Ddesktop.tests=false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
